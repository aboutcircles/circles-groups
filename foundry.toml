[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Optimizer settings
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
gnosis = "${GNOSIS_RPC}"

[etherscan]
gnosisscan = { key = "${GNOSIS_SCAN_KEY}", chain = 100 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
